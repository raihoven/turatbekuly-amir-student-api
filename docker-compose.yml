name: turatbekuly-amir-student-api

services:
  db:
    image: postgres:16
    container_name: turatbekuly-amir-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - turatbekuly_amir_pgdata:/var/lib/postgresql/data
    networks:
      - turatbekuly_amir_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: turatbekuly-amir-student-api:${APP_TAG:-v1.0-turatbekuly-amir-37776}
    container_name: turatbekuly-amir-app
    extra_hosts:
      - "db:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - turatbekuly_amir_net

volumes:
  turatbekuly_amir_pgdata:

networks:
  turatbekuly_amir_net:
